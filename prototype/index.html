<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathfinder v2 — test prototype</title>
<style>
:root{--bg:#f6f7f4;--pn:#fff;--ink:#16211d;--mu:#5f6b66;--ln:#dfe4de;--br:#0e6b55;--b2:#e7f2ee;--wa:#a86a00;--no:#b3261e;--ok:#12724f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--pn:#18211d;--ink:#eaf0ec;--mu:#9aa8a1;--ln:#2b3832;--br:#4fc4a2;--b2:#1b2e27;--wa:#e0a63a;--no:#f08b83;--ok:#5fd3a5}}
:root[data-theme="dark"]{--bg:#0f1512;--pn:#18211d;--ink:#eaf0ec;--mu:#9aa8a1;--ln:#2b3832;--br:#4fc4a2;--b2:#1b2e27;--wa:#e0a63a;--no:#f08b83;--ok:#5fd3a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln);background:var(--pn);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font:700 19px Georgia,serif;margin-right:auto}nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
button,.btn{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button.on,.btn.p{background:var(--br);border-color:var(--br);color:#fff}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--br);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:20px 18px 60px}
.note{font-size:13px;color:var(--mu);background:var(--b2);padding:8px 12px;border-radius:8px;margin-bottom:14px}
.grid{display:grid;gap:12px}.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px}
.mu{color:var(--mu);font-size:14px}h2{font-size:23px;margin:18px 0 10px}h3{font-size:17px;margin:14px 0 6px}
.el{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:600;font-size:13px;border:1px solid var(--ln)}
.e-Eligible{background:var(--b2);color:var(--ok);border-color:transparent}.e-Not{color:var(--no);border-color:var(--no)}.e-Pot{color:var(--wa);border-color:var(--wa)}
.fits{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.fit{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--ln)}
.fit b{font-weight:600}.High{color:var(--ok)}.Medium{color:var(--wa)}.Low{color:var(--no)}.NA{color:var(--mu)}
label{display:block;font-weight:600;margin:12px 0 4px}input,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.chips{display:flex;flex-wrap:wrap;gap:6px}
ul.r{list-style:none;padding:0;margin:6px 0}ul.r li{padding:4px 0}.p1{color:var(--ok)}.p2{color:var(--wa)}.p3{color:var(--no)}
.cmp{display:grid;grid-template-columns:1fr auto;gap:6px}.vs{font-size:12px;color:var(--mu);border:1px solid var(--ln);border-radius:5px;padding:0 6px;margin-left:6px}
.lock{border:1px dashed var(--ln);border-radius:10px;padding:10px;color:var(--mu);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.scroll{overflow-x:auto}
</style>
</head>
<body>
<div class="bar"><span class="logo">Pathfinder</span><nav id="nav"></nav><label style="margin:0;font-weight:400;display:flex;gap:6px;align-items:center;width:auto"><input type="checkbox" id="prem" style="width:auto"> Premium (demo)</label></div>
<main id="app"></main>
<script>
const CL={cs:["Artificial Intelligence","Data Science","Computer Science","Software Engineering","Cybersecurity"],ag:["Agriculture","Food Science"]};
const cl=f=>Object.keys(CL).find(k=>CL[k].includes(f));
const rel=(a,b)=>a===b?1:cl(a)&&cl(a)===cl(b)?.8:0;
const FL={Germany:"🇩🇪",Netherlands:"🇳🇱",Sweden:"🇸🇪",Finland:"🇫🇮",Romania:"🇷🇴",Hungary:"🇭🇺"};
const d=n=>{const t=new Date();t.setDate(t.getDate()+n);return t.toISOString().slice(0,10)};
const MY=["calculus","linear_algebra","programming","databases","statistics"]; // subjects mapped from the student's courses
// FICTIONAL SAMPLE DATA. vs = verification status per field: v verified, n needs verification, c conflicting
const O=[
{id:1,name:"MSc Data Science",uni:"Northern Lakes University",c:"Germany",f:"Data Science",tu:2500,lv:7200,fund:"partial",amt:3000,min:2.5,ms:4,ielts:null,pre:[],dl:d(75),vs:{min:"v",fund:"v",dl:"v"},age:4,host:"nlu.example.edu"},
{id:2,name:"MSc Artificial Intelligence",uni:"Rhine Technical Institute",c:"Germany",f:"Artificial Intelligence",tu:0,lv:7800,fund:"none",amt:0,min:3.6,ms:5,ielts:6.5,pre:["machine_learning"],dl:d(40),vs:{min:"v",ielts:"v",pre:"v",dl:"v"},age:9,host:"rti.example.edu"},
{id:3,name:"Baltic Excellence Master's Award",uni:"Baltic State University",c:"Sweden",f:"Computer Science",tu:14000,lv:9600,fund:"full",amt:23600,min:3.4,ms:5,ielts:6.5,pre:[],nat:false,dl:d(12),vs:{min:"v",nat:"v",fund:"v",dl:"v"},age:6,host:"bsu.example.edu",type:"Scholarship"},
{id:4,name:"MSc Computer Science (AI track)",uni:"Delta University",c:"Netherlands",f:"Computer Science",tu:14500,lv:10800,fund:"partial",amt:6000,min:6.5,ms:10,ielts:6.5,pre:[],dl:d(55),vs:{min:"v",ielts:"v",fund:"n",dl:"v"},age:12,host:"delta.example.edu"},
{id:5,name:"Carpathian Government Scholarship",uni:"Carpathian State Program",c:"Romania",f:"Software Engineering",tu:3200,lv:4800,fund:"full",amt:8000,min:2.8,ms:5,ielts:null,pre:[],nat:true,dl:d(30),vs:{min:"v",nat:"v",fund:"v",dl:"v"},age:3,host:"gov-scholarships.example.ro",type:"Scholarship"},
{id:6,name:"MSc Software Engineering",uni:"Lakeland Polytechnic",c:"Finland",f:"Software Engineering",tu:12000,lv:9000,fund:"partial",amt:12000,min:3.0,ms:5,ielts:6.0,pre:[],dl:d(95),vs:{min:"n",ielts:"v",fund:"n",dl:"v"},age:28,host:"lakeland.example.fi"},
{id:7,name:"Danube Research Fellowship",uni:"Danube Institute",c:"Hungary",f:"Data Science",tu:0,lv:6000,fund:"full",amt:6000,min:4.0,ms:5,ielts:6.5,pre:[],nat:true,dl:d(5),vs:{min:"v",nat:"v",ielts:"v",fund:"v",dl:"v"},age:2,host:"danube.example.hu",type:"Scholarship"},
{id:8,name:"MSc Machine Learning Engineering",uni:"Transylvania Tech",c:"Romania",f:"Artificial Intelligence",tu:3000,lv:4800,fund:"none",amt:0,min:null,ms:5,ielts:null,pre:[],dl:d(22),vs:{dl:"c"},age:15,host:"ttech.example.ro"},
{id:9,name:"MSc Agricultural Science",uni:"Greenfield University",c:"Netherlands",f:"Agriculture",tu:15000,lv:10800,fund:"partial",amt:5000,min:3.0,ms:5,ielts:6.5,pre:[],dl:d(48),vs:{min:"v",ielts:"v",fund:"v",dl:"v"},age:8,host:"greenfield.example.nl"}];
const P={cit:"Nigeria",bg:"Computer Engineering",gpa:3.23,sc:5,cls:"Second Class Lower",fields:["Artificial Intelligence","Data Science"],countries:["Germany","Netherlands","Sweden","Finland","Romania"],anywhere:false,budget:10000,fpref:"full-pref",ielts:"",eng:true};
const S={v:"profile",id:null,saved:new Set(),cmp:new Set()};
const vlab={v:"verified",n:"needs verification",c:"conflicting",x:"not provided"};
function ev(o){const R=[],vs=k=>o.vs[k]||"x";
const push=(k,code,out,pol,text,user,req)=>{let s=vs(k),oo=out,un=false;
 if(out==="unmet"&&s!=="v")oo="unknown"; if(s==="c")oo="unknown"; if(out==="met"&&s!=="v")un=true;
 R.push({k,code,out:oo,raw:out,un,pol:oo==="met"?(un?2:1):oo==="unmet"?3:2,text,user,req,s,hard:true})};
// GPA
if(o.min==null)R.push({k:"min",code:"GPA",out:"unknown",pol:2,text:"No minimum GPA published",s:"x",hard:true});
else{const r=P.gpa/P.sc,m=o.min/o.ms,ind=o.ms!==P.sc,near=ind&&Math.abs(r-m)<=.05*m;
 const out=near?"unknown":r>=m?"met":"unmet";
 push("min","GPA",out==="unknown"?"unknown":out,0,out==="met"?"Your GPA meets the published minimum":out==="unmet"?"Your GPA is below the published minimum":"Close to the minimum, and the scale conversion is only indicative",P.gpa+" / "+P.sc,o.min+" / "+o.ms);
 if(near){R[R.length-1].out="unknown";R[R.length-1].pol=2}}
// prerequisites
if(o.pre.length){const miss=o.pre.filter(x=>!MY.includes(x));push("pre","PREREQ",miss.length?"unmet":"met",0,miss.length?"Missing prerequisite subject: "+miss.join(", ").replace(/_/g," "):"Prerequisite subjects covered","Covered: "+MY.length+" subjects","Requires: "+o.pre.join(", ").replace(/_/g," "))}
// nationality
if(o.nat===false)push("nat","NAT","unmet",0,"Applicants from "+P.cit+" are not eligible","Citizenship: "+P.cit,"Excluded");
else if(o.nat===true)push("nat","NAT","met",0,P.cit+" applicants are eligible",P.cit,"Open to "+P.cit);
// language (soft unless proof clearly missing)
if(o.ielts){const h=parseFloat(P.ielts);const out=h>=o.ielts?"met":h?"unmet":"unknown";
 const t=out==="met"?"IELTS meets the requirement":h?"IELTS is below the requirement":P.eng?"IELTS "+o.ielts+" listed. Your English-taught degree may be accepted; confirm with the university":"IELTS "+o.ielts+" required and you have no test yet";
 push("ielts","LANG",out,0,t,P.ielts||"No test","IELTS "+o.ielts);R[R.length-1].hard=false}
// eligibility aggregate over hard
const H=R.filter(x=>x.hard),ver=x=>x.s==="v";
let el;if(H.some(x=>x.raw==="unmet"&&x.out==="unmet"))el="Not Eligible";
else if(H.length&&H.every(x=>x.out==="met"&&ver(x)))el="Eligible";
else if(H.some(x=>x.out==="met"))el="Potentially Eligible";else el="Unknown";
// fit dims
const cost=o.tu+o.lv,net=o.fund==="full"&&o.vs.fund==="v"?0:Math.max(0,cost-(o.vs.fund==="v"?o.amt:0));
const band=n=>n==null?"NA":n>=75?"High":n>=50?"Medium":"Low";
const relw=Math.max(...P.fields.map(f=>rel(f,o.f)));
const cov=o.pre.length?o.pre.filter(x=>MY.includes(x)).length/o.pre.length:1;
const head=o.min!=null?Math.min(1,Math.max(0,(P.gpa/P.sc-o.min/o.ms+.1)/.2)):null;
let a=null;{let w=60,s=relw*60;if(o.pre.length){w+=25;s+=cov*25}if(head!=null){w+=15;s+=head*15}a=Math.round(s/w*100)}
const f=P.budget==null?100:net<=P.budget?100:Math.max(0,Math.round(100-(net-P.budget)/Math.max(P.budget,1000)*100));
const FM={"full-only":{full:100,partial:40,none:0},"full-pref":{full:100,partial:65,none:30},"partial":{full:100,partial:100,none:40},"self":{full:100,partial:100,none:100}}[P.fpref][o.fund];
const lg=!o.ielts?100:parseFloat(P.ielts)>=o.ielts?100:P.ielts?20:P.eng?85:40;
const g=P.anywhere||P.countries.includes(o.c)?100:40;
const conf=k=>o.vs[k]==="v"?"high":o.vs[k]?"medium":"low";
const fit={Academic:{n:a,b:band(a),c:conf("min")},Financial:{n:f,b:band(f),c:conf("fund")},Funding:{n:FM,b:band(FM),c:conf("fund")},Language:{n:o.ielts?lg:100,b:band(lg),c:o.ielts?conf("ielts"):"high"},Geographic:{n:g,b:band(g),c:"high"}};
// evidence
const E=[];
if(rel(P.bg,o.f)>=.8||relw>=.8)E.push({p:1,t:relw===1?"Matches a field you selected: "+o.f:o.f+" is closely related to your chosen fields"});
if(P.anywhere||P.countries.includes(o.c))E.push({p:1,t:o.c+" is one of your preferred countries"});else E.push({p:2,t:o.c+" is outside your preferred countries"});
E.push({p:net<=(P.budget??1e9)?1:3,t:"Estimated annual cost after verified funding: €"+net.toLocaleString()+" (your budget: "+(P.budget==null?"flexible":"€"+P.budget.toLocaleString())+")"});
if(o.fund==="full")E.push({p:o.vs.fund==="v"?1:2,t:"Fully funded"+(o.vs.fund==="v"?"":" (funding not verified)")});
else if(o.fund==="partial")E.push({p:2,t:"Partial funding, potential €"+o.amt.toLocaleString()+". Potential combination: verify compatibility with the provider"});
else E.push({p:2,t:"No funding found for this opportunity"});
const dl=Math.ceil((new Date(o.dl)-new Date())/864e5);
const tier={Eligible:3,"Potentially Eligible":2,Unknown:1,"Not Eligible":0}[el];
const vals=Object.values(fit).filter(x=>x.n!=null).map(x=>x.n);
return {...o,R,el,fit,E,cost,net,dl,rank:tier*1000+vals.reduce((s,x)=>s+x,0)/vals.length+(dl<=14?4:0)}}
const ALL=()=>O.map(ev).filter(o=>o.dl>=0);
const ec=e=>e==="Eligible"?"e-Eligible":e==="Not Eligible"?"e-Not":e==="Potentially Eligible"?"e-Pot":"";
const fits=o=>`<div class="fits">${Object.entries(o.fit).map(([k,v])=>`<span class="fit">${k}: <b class="${v.b}">${v.b==="NA"?"Not enough data":v.b}</b></span>`).join("")}</div>`;
const dlb=n=>(n<=7?"🔴 ":n<=21?"🟡 ":"🟢 ")+n+" days left";
function card(o){return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><h3 style="margin-top:0">${o.name}</h3><div class="mu">${o.uni} · ${FL[o.c]} ${o.c}${o.type?" · "+o.type:""}</div></div><div><span class="el ${ec(o.el)}">${o.el}</span></div></div>${fits(o)}
<div class="mu">Est. cost €${o.net.toLocaleString()}/yr · ${dlb(o.dl)}</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" data-open="${o.id}">View details</button><button data-save="${o.id}">${S.saved.has(o.id)?"Saved ✓":"Save"}</button><button data-cmp="${o.id}">${S.cmp.has(o.id)?"In comparison ✓":"Compare"}</button></div></div>`}
function nav(){document.getElementById("nav").innerHTML=[["profile","Profile"],["dash","For you"],["saved","Saved"],["cmp","Compare ("+S.cmp.size+")"]].map(([k,l])=>`<button class="${S.v===k?"on":""}" data-go="${k}">${l}</button>`).join("")}
const chip=(n,l,sel)=>`<div class="chips">${l.map(x=>`<button class="${sel.includes(x)?"on":""}" data-chip="${n}" data-v="${x}">${x}</button>`).join("")}</div>`;
function profile(){return `<h2>Your profile</h2><div class="card"><div class="row"><div><label>Citizenship</label><input id="cit" value="${P.cit}"></div><div><label>Degree studied</label><input id="bg" value="${P.bg}"></div></div>
<div class="row"><div><label>GPA / CGPA</label><input id="gpa" type="number" step=".01" value="${P.gpa}"></div><div><label>Scale</label><select id="sc">${[4,5,10].map(s=>`<option ${s==P.sc?"selected":""}>${s}</option>`).join("")}</select></div></div>
<label>Fields you want (Master's)</label>${chip("fields",["Artificial Intelligence","Data Science","Computer Science","Software Engineering","Cybersecurity","Agriculture"],P.fields)}
<label>Countries</label>${chip("countries",Object.keys(FL),P.countries)}
<div class="row"><div><label>Annual budget</label><select id="bud">${[[0,"Fully funded only"],[5000,"Under €5,000"],[10000,"Under €10,000"],[15000,"Under €15,000"],["","Flexible"]].map(([v,l])=>`<option value="${v}" ${v===P.budget?"selected":""}>${l}</option>`).join("")}</select></div>
<div><label>Funding preference</label><select id="fp">${[["full-only","Fully funded only"],["full-pref","Fully funded preferred"],["partial","Partial acceptable"],["self","Self-funded"]].map(([v,l])=>`<option value="${v}" ${v===P.fpref?"selected":""}>${l}</option>`).join("")}</select></div></div>
<div class="row"><div><label>IELTS (blank if none)</label><input id="ie" type="number" step=".5" value="${P.ielts}"></div><div><label>English-taught degree</label><select id="en"><option value="1" ${P.eng?"selected":""}>Yes</option><option value="0" ${P.eng?"":"selected"}>No</option></select></div></div>
<p class="mu">Course data: ${MY.length} subjects mapped from your courses (calculus, linear algebra, programming, databases, statistics).</p><button class="btn p" data-go="dash">See my options</button></div>`}
function read(){const g=i=>document.getElementById(i);if(!g("cit"))return;P.cit=g("cit").value;P.bg=g("bg").value;P.gpa=parseFloat(g("gpa").value)||0;P.sc=+g("sc").value;const b=g("bud").value;P.budget=b===""?null:+b;P.fpref=g("fp").value;P.ielts=g("ie").value;P.eng=g("en").value==="1"}
function dash(){const l=ALL().sort((a,b)=>b.rank-a.rank),ok=l.filter(o=>o.el!=="Not Eligible"&&!(P.fpref==="full-only"&&o.fund!=="full")),no=l.filter(o=>o.el==="Not Eligible");
return `<h2>For you</h2><p class="mu">${ok.length} options fit your profile. Eligibility and fit are shown separately, and nothing here is a guarantee.</p><div class="grid">${ok.map(card).join("")}</div>
${no.length?`<h2>Not eligible right now</h2><div class="grid">${no.map(o=>`<div class="card"><b>${o.name}</b> <span class="mu">· ${o.uni}</span><ul class="r">${o.R.filter(x=>x.out==="unmet").map(x=>`<li class="p3">❌ ${x.text}</li>`).join("")}</ul><button data-open="${o.id}">See why and alternatives</button></div>`).join("")}</div>`:""}`}
const src=r=>`<span class="vs">${vlab[r.s]}</span>`;
function detail(){const o=ALL().find(x=>x.id===S.id)||ev(O.find(x=>x.id===S.id)),pr=document.getElementById("prem").checked,no=o.el==="Not Eligible";
const bad=o.R.filter(x=>x.out==="unmet"),alts=ALL().filter(x=>x.id!==o.id&&x.el!=="Not Eligible"&&rel(o.f,x.f)>=.6).sort((a,b)=>b.rank-a.rank).slice(0,4);
return `<button data-go="dash">← Back</button><div class="card" style="margin-top:12px"><h2 style="margin-top:0">${o.name}</h2><div class="mu">${o.uni} · ${o.c} · Source: ${o.host}, checked ${o.age} days ago</div>
<p><span class="el ${ec(o.el)}">${o.el}</span> <span class="mu">based on published requirements. This is not a prediction of admission.</span></p>
${no?`<h3>Why you don't currently qualify</h3>${bad.map(x=>`<div class="card" style="margin:8px 0"><span class="p3">❌ ${x.text}</span>${src(x)}<div class="mu">${x.req?"Required: "+x.req+" · Your record: "+x.user:""}</div></div>`).join("")}`
:`<h3>Why you're seeing this</h3><ul class="r">${o.E.map(e=>`<li class="p${e.p}">${["","✅","⚠️","❌"][e.p]} ${e.t}</li>`).join("")}</ul><h3>Requirements checked</h3><ul class="r">${o.R.map(x=>`<li class="p${x.pol}">${["","✅","⚠️","❌"][x.pol]} ${x.text}${x.un?" (unconfirmed)":""}${src(x)}</li>`).join("")}${o.R.length?"":"<li class='mu'>No requirements published: Information not provided.</li>"}</ul>`}
<h3>Fit</h3>${pr?`<div class="scroll"><table><tr><th>Dimension</th><th>Score</th><th>Band</th><th>Data confidence</th></tr>${Object.entries(o.fit).map(([k,v])=>`<tr><td>${k}</td><td>${v.n??"–"}</td><td class="${v.b}">${v.b==="NA"?"Not enough data":v.b}</td><td>${v.c}</td></tr>`).join("")}</table></div>`:fits(o)+`<div class="lock">🔒 Premium shows the score and data confidence behind each band.</div>`}
<h3>Cost</h3><p>Tuition €${o.tu.toLocaleString()} + living €${o.lv.toLocaleString()} = €${o.cost.toLocaleString()}/yr. ${o.fund!=="none"?`Funding ${o.vs.fund==="v"?"(verified)":"(not verified, not deducted)"}: €${o.amt.toLocaleString()}. `:""}Estimated remaining: <b>€${o.net.toLocaleString()}</b>. ${o.net<=(P.budget??1e9)?"🟢 Fits your budget":"🔴 About €"+(o.net-P.budget).toLocaleString()+" above your budget"}</p>
<h3>Deadline</h3><p>${o.dl} · ${dlb(o.dl)} ${src({s:o.vs.dl||"x"})}${o.vs.dl==="c"?'<br><span class="p2">⚠️ Sources disagree on this date. Check the official page before relying on it.</span>':""}</p>
${no||o.el==="Potentially Eligible"?`<h3>Closest routes</h3><p class="mu">${no?"If this isn't a fit, these are the nearest realistic options.":"Related options if this doesn't work out."}</p><div class="grid">${alts.map(a=>`<div class="card"><b>${a.name}</b> <span class="el ${ec(a.el)}">${a.el}</span><div class="mu">${rel(o.f,a.f)===1?"Same field, different school":"Related program: "+a.f+" shares core subjects with "+o.f}${bad.length&&!a.R.some(x=>x.raw==="unmet")?". Avoids the requirement that blocks this one":""}</div><button data-open="${a.id}">View</button></div>`).join("")}</div>`:""}
<div style="margin-top:12px;display:flex;gap:8px"><button class="btn p" data-save="${o.id}">${S.saved.has(o.id)?"Saved ✓":"Save"}</button><button data-cmp="${o.id}">${S.cmp.has(o.id)?"In comparison ✓":"Compare"}</button></div></div>`}
function saved(){const l=ALL().filter(o=>S.saved.has(o.id));return `<h2>Saved</h2><div class="grid">${l.map(card).join("")||'<div class="card">Nothing saved yet. Save an option to track it here.</div>'}</div>`}
function cmp(){const l=ALL().filter(o=>S.cmp.has(o.id));if(l.length<2)return `<h2>Compare</h2><div class="card">Add 2 or 3 options with the Compare button.</div>`;
const rows=[["Tuition",o=>"€"+o.tu.toLocaleString()],["Living estimate",o=>"€"+o.lv.toLocaleString()],["Academic requirement",o=>o.min==null?"No published cutoff":o.min+" / "+o.ms],["Funding",o=>o.fund==="full"?"Full":o.fund==="partial"?"Partial (€"+o.amt.toLocaleString()+")":"None found"],["Deadline",o=>o.dl],["Eligibility",o=>o.el],...["Academic","Financial","Funding","Language","Geographic"].map(k=>[k+" fit",o=>o.fit[k].b==="NA"?"Not enough data":o.fit[k].b])];
return `<h2>Compare</h2><p class="mu">Side by side. We don't pick a winner for you.</p><div class="scroll"><table><tr><th></th>${l.map(o=>`<th>${o.name}<br><span class="mu">${o.uni}</span></th>`).join("")}</tr>${rows.map(([n,f])=>`<tr><td>${n}</td>${l.map(o=>`<td>${f(o)}</td>`).join("")}</tr>`).join("")}</table></div>`}
function render(){nav();document.getElementById("app").innerHTML='<div class="note">Test prototype with fictional sample data. Real records will come from official sources with field-level verification.</div>'+({profile,dash,detail,saved,cmp})[S.v]()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-open],[data-save],[data-cmp],[data-chip]");if(!t)return;read();
if(t.dataset.go)S.v=t.dataset.go;else if(t.dataset.open){S.id=+t.dataset.open;S.v="detail";scrollTo(0,0)}
else if(t.dataset.save){const i=+t.dataset.save;S.saved.has(i)?S.saved.delete(i):S.saved.add(i)}
else if(t.dataset.cmp){const i=+t.dataset.cmp;S.cmp.has(i)?S.cmp.delete(i):S.cmp.size<3&&S.cmp.add(i)}
else if(t.dataset.chip){const a=P[t.dataset.chip],v=t.dataset.v,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}
render()});
document.getElementById("prem").addEventListener("change",render);render();
</script>
</body>
</html>
